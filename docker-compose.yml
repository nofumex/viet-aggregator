services:
  bot:
    build: .
    image: viet-aggregator
    container_name: viet-aggregator
    restart: unless-stopped

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s